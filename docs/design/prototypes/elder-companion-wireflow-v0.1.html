<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>闺蜜机 · 功能交互草图 V0.1</title>
<style>
:root{--bg:#f7f5f1;--paper:#fff;--ink:#252b2b;--muted:#717a78;--line:#e5e8e4;--brand:#287969;--warm:#eaf5ed;--gold:#edac51;--shadow:0 8px 34px #273c3712}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:#d8e1dc}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}.wrap{max-width:1500px;min-height:100vh;margin:auto;display:flex;background:var(--bg);box-shadow:var(--shadow)}.sidebar{width:220px;background:#163a36;color:#fff;padding:28px 14px 22px;display:flex;flex-direction:column;gap:18px;flex:none}.logo{padding:5px 14px 15px}.logo strong{font-size:24px;letter-spacing:1px}.logo small{display:block;color:#bad5ca;font-size:12px;margin-top:4px}.menu{display:flex;flex-direction:column;gap:7px}.menu button{width:100%;color:#d9e6e0;text-align:left;border:0;border-radius:12px;background:none;padding:14px 16px;font-weight:600}.menu button.active{background:#2b5b50;color:#fff}.menu button:hover{background:#285247}.menu button .ico{display:inline-block;width:24px;margin-right:10px}.sidebottom{margin-top:auto;padding:12px;border-top:1px solid #457068;font-size:13px;color:#d0e4df}.main{flex:1;min-width:0;position:relative;padding:20px clamp(18px,3vw,42px) 90px;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}.crumb{color:var(--muted);font-size:13px}.topactions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 15px;font-size:13px;color:var(--ink)}.pill.selected{background:#d9f0e5;border-color:#81b5a6;color:#205e51}.mode{color:#fff;background:#337b6d;border-radius:99px;padding:7px 12px;font-size:12px}.demo{font-size:11px;color:#8b5d22;background:#fff1d9;border:1px solid #f8d8a5;border-radius:99px;padding:6px 10px}.h1{font-size:clamp(26px,3.1vw,38px);font-weight:760;letter-spacing:-.5px;line-height:1.24;margin:2px 0 10px}.sub{color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:21px;box-shadow:0 2px 12px #12372805}.click{transition:.16s;border-radius:20px;cursor:pointer}.click:hover{transform:translateY(-2px);border-color:#9ecbbc;box-shadow:0 9px 24px #24554b1b}.hero{background:linear-gradient(118deg,#e7f3e7,#f7eed7);border:1px solid #d8e8db;border-radius:26px;padding:27px 32px;display:flex;gap:18px;justify-content:space-between;align-items:center;margin-bottom:22px}.hero h2{font-size:26px;margin:0 0 8px}.hero p{margin:0 0 18px;color:#52615b}.section{display:flex;align-items:center;justify-content:space-between;margin:27px 0 15px}.section h3{margin:0;font-size:20px}.section small{color:var(--muted)}.tag{font-size:12px;color:#397361;background:#e8f3ed;border-radius:8px;padding:4px 9px;display:inline-block;margin-bottom:12px}.card h4{font-size:19px;margin:0 0 7px}.card p{color:var(--muted);margin:0 0 12px;font-size:14px}.muted{color:var(--muted)}.b{border:0;border-radius:12px;padding:11px 17px;font-weight:700;background:var(--brand);color:white}.b.secondary{background:#ebf3ef;color:#246b5d}.b.ghost{border:1px solid #ccd8d1;background:#fff;color:#335c53}.b.orange{background:#d97638}.b + .b{margin-left:8px}.ftr{position:absolute;bottom:15px;left:clamp(18px,3vw,42px);color:#88928e;font-size:12px;right:40px}.media{height:115px;border-radius:14px;background:linear-gradient(125deg,#d0e8df,#f8edd7);display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:15px}.media.alt{background:linear-gradient(130deg,#f8e5de,#e2e6f2)}.media.blu{background:linear-gradient(130deg,#dae6f2,#d3ebed)}.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:22px}.player{min-height:350px;background:radial-gradient(ellipse at 50% 30%,#456f69,#0c2527);color:white;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:20px;text-align:center}.player .play{width:80px;height:80px;border-radius:50%;background:#ffffff25;color:#fff;border:1px solid #ffffff70;font-size:31px;cursor:pointer}.player strong{display:block;font-size:23px;margin:20px 0 8px}.progress{height:7px;background:#c5d4cf;border-radius:20px;overflow:hidden;margin-top:16px}.progress span{display:block;background:#458d7c;height:100%;transition:.2s}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.row.left{justify-content:flex-start}.stack{display:flex;flex-direction:column;gap:13px}.divider{height:1px;background:var(--line);margin:16px 0}.ai-bubble{position:fixed;bottom:34px;right:max(calc((100vw - 1490px)/2 + 24px),24px);z-index:21;background:#1e6558;color:white;border:none;box-shadow:0 14px 35px #27594955;border-radius:99px;padding:17px 21px;font-size:16px;font-weight:700}.drawer{position:fixed;z-index:22;right:max(calc((100vw - 1500px)/2),0px);top:0;height:100vh;width:min(450px,95vw);background:white;box-shadow:-15px 0 45px #203e3a44;padding:27px 25px;overflow-y:auto}.drawer header{display:flex;align-items:center;justify-content:space-between}.drawer header h2{margin:0}.drawer .inputrow{display:flex;gap:8px;margin:17px 0}.drawer input{width:100%;border:1px solid #cbd7d0;padding:12px;border-radius:12px;min-width:0}.drawer .choices{display:grid;gap:9px}.drawer .choices button{text-align:left;background:#f1f6f2;border:1px solid #dfebdf;padding:13px;border-radius:12px}.drawer .airesult{background:#eaf5ed;border:1px solid #cfe6d9;padding:15px;border-radius:15px;margin:15px 0}.shade{position:fixed;z-index:20;inset:0;background:#0c302b50}.status{padding:15px;border-radius:14px;background:#f5f7f5;border:1px solid var(--line);margin:13px 0}.warn{padding:13px;background:#fff7e9;color:#77582c;border:1px solid #f4dab3;border-radius:11px;font-size:13px;margin:12px 0}.formline{padding:14px 0;border-bottom:1px solid var(--line)}.formline label{display:block;color:#52625a;margin-bottom:8px;font-size:13px;font-weight:700}.amount{font-size:31px;color:#235e4f;font-weight:800}.footbuttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 20px}.tabs button{background:#fff;border:1px solid var(--line);padding:10px 17px;border-radius:99px}.tabs button.active{background:#246d5c;border-color:#246d5c;color:white}.light{height:200px;border-radius:16px;background:linear-gradient(145deg,#dadce8,#f4e7ce,#d6e7df);display:grid;place-items:center;font-size:58px}.kbd{font-size:12px;color:#5b6762;padding:3px 7px;background:#eee;border-radius:6px}input[type=checkbox]{accent-color:#237565;width:18px;height:18px}.person{font-size:44px;border-radius:50%;width:82px;height:82px;background:#e0eee6;display:grid;place-items:center;margin-bottom:12px}.notice{border-left:3px solid #5c9e8f;padding:8px 14px;background:#edf5ee;border-radius:0 10px 10px 0;margin:18px 0}.space{height:4px}.mobilebar{display:none}@media(max-width:1000px){.sidebar{width:162px}.sidebar .logo strong{font-size:20px}.menu button{padding:12px 8px;font-size:14px}.main{padding:18px 22px 90px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){.wrap{display:block}.sidebar{display:none}.main{min-height:100vh;padding:16px 15px 100px}.grid,.grid.two,.split{grid-template-columns:1fr}.hero{display:block;padding:22px}.hero h2{font-size:23px}.h1{font-size:26px}.top{align-items:flex-start}.topactions{justify-content:flex-end}.mobilebar{position:fixed;z-index:19;bottom:0;left:0;right:0;background:#153b35;color:#fff;display:flex;justify-content:space-around;padding:9px 0 12px}.mobilebar button{color:#d7eae1;background:none;border:0;font-size:11px;display:grid;justify-items:center}.mobilebar button b{font-size:20px}.mobilebar button.active{color:#f8d591}.ai-bubble{bottom:70px;right:14px;font-size:13px;padding:13px 15px}.ftr{bottom:68px;font-size:11px}.drawer{width:100%}}
</style>
</head>
<body><div class="wrap"><aside class="sidebar"><div class="logo"><strong>乐龄 · 闺蜜机</strong><small>功能交互草图 V0.1</small></div><div id="side" class="menu"></div><div class="sidebottom">供功能评审使用<br/>无真实支付 / 无真实 AI<br/><span id="modeSide"></span></div></aside><main class="main"><header class="top"><div class="crumb" id="crumb">AI MIRROR / 产品交互</div><div class="topactions"><span class="demo">所有业务结果为示例</span><button class="pill" id="switch" onclick="switchMode()">切到公共服务机</button><button class="pill" id="profile" onclick="go('me')">我的</button></div></header><div id="view"></div><div class="ftr">三创 AI Mirror · 设计评审样稿 · 不包含真实 AI 调用、实际授权视频或支付操作</div></main></div><div id="mobilebar" class="mobilebar"></div><button class="ai-bubble" onclick="openAI()">✦ &nbsp;<span id="aiLabel">叫我的闺蜜</span></button><div id="modal"></div>
<script>
const nav=[['home','⌂','首页'],['video','▣','看节目'],['create','✦','AI趣玩'],['life','▦','本地生活'],['shop','▤','商城']];
const state={mode:'personal',screen:'home',episode:12,playing:false,progress:61,watched:true,saved:false,cart:[],item:null,application:null,member:'个人用户',speaker:'温婉老师',voice:'温和女声',classTab:'短剧',areaTab:'活动',art:'民国风写真',artSaved:false,ai:false,aiText:'',aiResult:null,publicIdentified:false,submitted:false,modeOrigin:'home',courseRunning:false,voiceWake:false};
function e(t){return String(t).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
const cards=[{name:'家庭装洗衣液',price:29.9,detail:'2kg · 同城配送',merchant:'惠生活用品店',icon:'🧴'},{name:'实惠洗衣液',price:18.9,detail:'1kg · 门店自提',merchant:'社区便利店',icon:'🧺'},{name:'浓缩洗衣液',price:43.9,detail:'2.5kg · 配送另计',merchant:'优选日用品',icon:'🫧'}];
const events=[{name:'书法兴趣课',day:'周六 09:30',place:'邻里活动中心',benefit:'免费报名 · 限额',id:1},{name:'健康知识讲座',day:'周日 14:00',place:'乐龄活动中心',benefit:'科普讲座 · 赠品规则见详情',id:2},{name:'重阳歌舞交流',day:'下周三 15:00',place:'文化交流空间',benefit:'免费参与',id:3}];
const tile=(icon,title,desc,fn,tag='')=>`<article class="card click" onclick="${fn}"><div class="media">${icon}</div>${tag?`<span class="tag">${tag}</span>`:''}<h4>${title}</h4><p>${desc}</p><strong style="font-size:13px;color:#257765">查看详情 →</strong></article>`;
function go(p){state.screen=p;closeAI();render();window.scrollTo(0,0)};
function switchMode(){state.mode=state.mode==='personal'?'public':'personal';state.screen='home';state.aiResult=null;state.publicIdentified=false;state.submitted=false;state.artSaved=false;state.playing=false;closeAI();render()}
function rowBtns(){return `<div class="footbuttons"><button class="b" onclick="go('video')">去看免费短剧</button><button class="b secondary" onclick="go('life')">看看本地活动</button><button class="b ghost" onclick="openAI()">唤起 AI</button></div>`}
function home(){const pub=state.mode==='public';return `<h1 class="h1">${pub?'欢迎来到乐龄生活服务站':'下午好，李叔'}</h1><p class="sub">${pub?'活动、福利、服务和趣味 AI，随时开始体验。':'想看剧、找活动、聊聊天，还是让闺蜜帮忙办事？'}</p><section class="hero"><div><span class="tag">${pub?'本网格活动精选':'继续观看 · 免费剧场'}</span><h2>${pub?'本周活动与福利':'《旧城岁月》 · 第 '+state.episode+' 集'}</h2><p>${pub?'先体验，报名和个人作品可由本人确认后取回。':'上次看到第 '+state.episode+' 集的 '+state.progress+'%，随时接着看。'}</p><button class="b" onclick="go('${pub?'life':'player'}')">${pub?'查看附近活动':'▶ 继续看剧'}</button></div><div style="font-size:75px;opacity:.7">${pub?'🎁':'🎬'}</div></section><div class="section"><h3>${pub?'精选服务':'今天想做什么？'}</h3><small>不强制使用 AI</small></div><div class="grid">${tile('🎭','免费看剧','短剧、戏曲、新闻、广场舞；支持续播和收藏。',"go('video')",'基础权益')}${tile('🎨','AI 趣玩','写真、回忆录、书画；作品由本人决定是否分享。',"go('create')",'AI 体验')}${tile('🎫','活动与福利','当地课程、福利券、讲座、生活服务。',"go('life')",'本网格')}</div><div class="section"><h3>更多值得看看</h3><small>平台与商家共同供给</small></div><div class="grid two">${tile('🧴','生活商城','店铺入驻平台，自有订单入口。',"go('shop')")}${tile('👩‍🏫','数字人课堂','同一门课可选讲师形象、声线和有限讲课风格。',"go('course')")}</div><div class="notice">${pub?'公共演示机不加载私人长期记忆。所有试用产生的素材在结束后清除。':'个人 AI 只有被唤起才回应，不会在你看剧时突然主动聊天。'}</div>`}
function video(){const cats=['短剧','戏曲老歌','新闻时事','广场舞','我的收藏'];return `<h1 class="h1">免费看剧 · 看节目</h1><p class="sub">基础娱乐免费；赞助与商品推荐会明确标识。</p><div class="tabs">${cats.map(x=>`<button class="${x===state.classTab?'active':''}" onclick="state.classTab='${x}';render()">${x}</button>`).join('')}</div><div class="grid">${tile('🎬',state.classTab==='短剧'?'旧城岁月':'精选'+state.classTab,'可收藏 · 支持下次续播。',"go('player')",'示例内容')}${tile('🎼',state.classTab==='新闻时事'?'今日资讯解读':'怀旧好时光','精选频道演示，无外部内容版权声称。',"go('player')",'内容占位')}${tile('🎭','朋友都在看','从兴趣与熟人推荐内容（演示）。',"go('player')",'推荐示例')}</div>`}
function player(){return `<div class="row"><h1 class="h1">旧城岁月 · 第 ${state.episode} 集</h1><button class="pill" onclick="go('video')">← 返回节目</button></div><div class="split"><div><div class="player"><div style="font-size:13px;color:#cbded8;position:absolute;left:25px;top:22px">样本播放器 · 无实际视频版权内容</div><button class="play" onclick="state.playing=!state.playing;state.progress=Math.min(95,state.progress+5);render()">${state.playing?'Ⅱ':'▶'}</button><strong>${state.playing?'正在模拟播放':'播放已暂停'}</strong><div style="color:#d7eae3">第 ${state.episode} 集 · 片源未接入</div><div style="width:80%;margin-top:15px"><div class="progress"><span style="width:${state.progress}%"></span></div><div class="row" style="font-size:13px;margin-top:6px"><span>观看进度 ${state.progress}%</span><span>本地演示</span></div></div></div><div class="footbuttons"><button class="b ghost" onclick="state.episode=Math.max(1,state.episode-1);state.progress=0;render()">上一集</button><button class="b" onclick="state.episode++;state.progress=0;render()">下一集</button><button class="b secondary" onclick="state.saved=!state.saved;render()">${state.saved?'✓ 已收藏':'☆ 收藏'}</button><button class="b ghost" onclick="openAI()">边看边问 AI</button></div></div><div class="stack"><div class="card"><span class="tag">主动探索，不插入强制购物</span><h4>看完想玩点什么？</h4><p>体验同款年代写真，或浏览自愿关联的服务。</p><button class="b secondary" onclick="go('create')">试试复古写真</button><div class="space"></div><button class="b ghost" onclick="go('shop')">看看商城服务</button></div><div class="card"><h4>观看记录</h4><p>个人模式可保存进度；公共模式不记住上一位用户。</p><div class="status">${state.mode==='personal'?'上次续播信息已保存在本次交互样稿状态里':'游客态 · 离开后将清空记录'}</div></div></div></div>`}
function life(){return `<h1 class="h1">本地生活</h1><p class="sub">按设备绑定的网格展示活动、福利和课程；登录后可结合个人兴趣。</p><div class="tabs">${['活动','福利','课程','健康科普'].map(x=>`<button class="${x===state.areaTab?'active':''}" onclick="state.areaTab='${x}';render()">${x}</button>`).join('')}</div><div class="grid">${(state.areaTab==='课程'?[events[0]]:events).map((x,i)=>tile(['✍️','🥚','💃'][i%3],x.name,`${x.day} · ${x.place}`,`eventDetail(${x.id})`,x.benefit)).join('')}${state.areaTab==='课程'?tile('👩‍🏫','数字人课程','选一个你喜欢的讲师，换种声音听历史。',"go('course')",'概念体验'):''}</div><div class="notice">活动、赠品和名额均为示例数据，不构成真实报名或领取承诺。</div>`}
function eventDetail(id){state.application=events.find(x=>x.id===id)||events[0];go('event')}
function event(){const x=state.application||events[0];return `<h1 class="h1">${x.name}</h1><p class="sub">活动详细信息 · 示例合作场所</p><div class="split"><div class="card"><span class="tag">本网格</span><div class="formline"><label>时间</label>${x.day}</div><div class="formline"><label>地点</label>${x.place}</div><div class="formline"><label>报名条件</label>${x.benefit}</div><div class="formline"><label>主办方</label>合作活动中心（演示）</div><p style="padding-top:18px">活动信息以正式接入的主办方公告为准。健康讲座不等于诊疗服务。</p><div class="footbuttons"><button class="b" onclick="go('signup')">大屏报名</button><button class="b secondary" onclick="go('scan')">扫码到手机报名</button><button class="b ghost" onclick="go('life')">返回列表</button></div></div><div class="card"><div class="media">📅</div><h4>网格服务</h4><p>商家和场地方提供活动，平台负责展示规则、审核与交易入口。</p></div></div>`}
function signup(){const x=state.application||events[0];return `<h1 class="h1">报名确认</h1><p class="sub">大屏直接报名 · 本次仅演示交互，不会向任何服务方发送信息。</p><div class="card" style="max-width:680px"><div class="formline"><label>活动</label>${x.name}</div><div class="formline"><label>时间 / 地点</label>${x.day} · ${x.place}</div><div class="formline"><label>参加人身份</label>${state.mode==='public'?'公共机游客（需要本人身份确认）':'当前个人账户 · 李叔（示例）'}</div>${state.mode==='public'?`<button class="b secondary" onclick="state.publicIdentified=!state.publicIdentified;render()">${state.publicIdentified?'✓ 已模拟确认本人身份':'模拟本人身份确认'}</button>`:''}<div class="warn">真实报名需接入账户验证、活动名额和服务商报名接口。此处仅为示例确认。</div><div class="footbuttons"><button class="b" ${state.mode==='public'&&!state.publicIdentified?'disabled':''} onclick="state.submitted=true;go('applied')">模拟确认报名</button><button class="b ghost" onclick="go('event')">返回活动</button></div></div>`}
function applied(){return `<h1 class="h1">报名流程演示完成</h1><div class="card" style="max-width:700px"><div class="light">✓</div><h3>已完成“示例报名”步骤</h3><p>这不是实际报名凭证。只有后续接入真实服务商接口并返回回执时，才能显示报名成功。</p><div class="footbuttons"><button class="b" onclick="${state.mode==='public'?"clearPublic()":"go('home')"}">${state.mode==='public'?'结束并清除':'返回首页'}</button></div></div>`}
function scan(){return `<h1 class="h1">手机扫码继续</h1><p class="sub">自有 H5 是可选的报名辅助渠道，不能依赖微信小程序。</p><div class="card" style="max-width:700px;text-align:center"><div style="width:210px;height:210px;background:repeating-linear-gradient(45deg,#e5ebe7,#e5ebe7 9px,#f9fbf8 9px,#f9fbf8 18px);border:15px solid white;border-radius:20px;margin:20px auto;display:grid;place-items:center;font-size:24px;color:#3f766a">二维码占位</div><h3>自有报名网页 · 待接入</h3><p>此处不提供虚构可用的二维码。将来扫码后在自有网页完成身份与报名。</p><button class="b secondary" onclick="go('event')">返回活动详情</button></div>`}
function shop(){return `<h1 class="h1">生活商城</h1><p class="sub">商家在我们平台开店，不做外部平台跳转导流。</p><div class="hero" style="padding:20px 26px"><div><span class="tag">用户与会员权益</span><h2>实用生活 · 放心选购</h2><p>商品、价格、运费与卖家均应清楚可查。</p><button class="b" onclick="openAI('洗衣液')">请 AI 帮我比价</button></div><div style="font-size:70px">🛍️</div></div><div class="section"><h3>店铺精选</h3><small>全部是演示商品</small></div><div class="grid">${cards.map((x,i)=>tile(x.icon,x.name,`${x.detail} · ¥${x.price.toFixed(2)}`,`product(${i})`,x.merchant)).join('')}</div>`}
function product(id){state.item=cards[id];go('product')}
function productPage(){const x=state.item||cards[0];return `<h1 class="h1">${x.name}</h1><div class="split"><div class="card"><div class="light">${x.icon}</div><h2>${x.name}</h2><div class="amount">¥${x.price.toFixed(2)}</div><div class="formline"><label>规格</label>${x.detail}</div><div class="formline"><label>入驻商家</label>${x.merchant}</div><div class="formline"><label>配送与售后</label>示例条款，真实合作商家尚未接入</div><div class="footbuttons"><button class="b" onclick="addCart()">加入购物车</button><button class="b secondary" onclick="addCart(true)">去结算</button></div></div><div class="card"><h4>消费确认</h4><p>AI 或内容推荐都要回到统一商品详情。最终价格以订单确认页为准。</p><div class="warn">演示商品，禁止当作真实在线销售承诺。</div></div></div>`}
function addCart(checkout=false){state.cart.push(state.item||cards[0]);if(checkout)go('checkout');else go('cart')}
function cart(){const sum=state.cart.reduce((s,x)=>s+x.price,0);return `<h1 class="h1">购物车</h1><div class="card" style="max-width:700px">${state.cart.length?state.cart.map((x,i)=>`<div class="formline row"><div>${x.icon} ${x.name}<br/><small class="muted">${x.merchant}</small></div><strong>¥${x.price.toFixed(2)}</strong><button class="pill" onclick="state.cart.splice(${i},1);render()">移除</button></div>`).join(''):'<p>购物车为空，去商城看看。</p>'}<div class="section"><strong>商品小计</strong><strong>¥${sum.toFixed(2)}</strong></div><p class="muted">运费需真实商家数据；本样稿不进行实际计费。</p><div class="footbuttons"><button class="b" ${state.cart.length?'':'disabled'} onclick="go('checkout')">核对订单</button><button class="b ghost" onclick="go('shop')">继续逛商城</button></div></div>`}
function checkout(){const sum=state.cart.reduce((s,x)=>s+x.price,0);return `<h1 class="h1">订单确认</h1><p class="sub">关键外部动作必须由人确认。此页面无真实扣款。</p><div class="card" style="max-width:770px"><div class="formline"><label>所选商品</label>${state.cart.map(x=>`${x.name} · ${x.merchant} · ¥${x.price.toFixed(2)}`).join('<br/>')||'尚未选择商品'}</div><div class="formline"><label>配送方式</label>演示配送（尚无真实可送达区域或运费）</div><div class="formline"><label>收件信息</label>请在真实系统安全录入；演示不采集地址或电话</div><div class="formline"><label>合计（仅商品示例）</label><span class="amount">¥${sum.toFixed(2)}</span></div><div class="warn">模拟订单。没有实际下单、支付、物流或履约。</div><div class="footbuttons"><button class="b" ${state.cart.length?'':'disabled'} onclick="go('orderDone')">确认模拟订单</button><button class="b ghost" onclick="go('cart')">返回修改</button></div></div>`}
function orderDone(){return `<h1 class="h1">订单流程已演示</h1><div class="card" style="max-width:700px"><div class="light">🧾</div><h3>未发生真实交易</h3><p>已演示 AI 选商品 → 加购物车 → 人工确认的完整路径。接真实支付前需验证商家、价税、配送、授权与售后。</p><button class="b" onclick="state.cart=[];go('home')">返回首页</button></div>`}
function create(){return `<h1 class="h1">AI 趣玩</h1><p class="sub">现在的自己也值得被记录。先玩，再决定是否保存和分享。</p><div class="grid">${tile('👒','艺术写真','换种风格看看自己；上传/拍摄素材须本人授权。',"artTopic('民国风写真')",'优先 PoC')}${tile('📖','人生小故事','听我讲一段往事，帮我整理成自己的文字。',"artTopic('人生故事')",'探索')}${tile('🖌️','书法作品展','把自己的书法装进不同的展示背景。',"artTopic('书法展示')",'探索')}</div><div class="notice">本低保真设计稿只模拟生成状态；真正 AI PoC 的供应商、成本、延迟和失败率必须另外验收。</div>`}
function artTopic(x){state.art=x;go('artSetup')}
function artSetup(){return `<h1 class="h1">${state.art}</h1><p class="sub">第一步：选择素材与风格，先确认个人授权。</p><div class="split"><div class="card"><div class="light">${state.art==='民国风写真'?'👒':state.art==='人生故事'?'📖':'🖌️'}</div><div class="formline"><label>素材</label>演示样本；不采集真人照片、录音或敏感资料</div><div class="formline"><label>风格</label>温暖 · 怀旧 · 自然</div><div class="formline"><label>处理提示</label>真正上传个人肖像/录音需事先告知处理用途与去向</div><div class="footbuttons"><button class="b" onclick="go('artResult')">模拟生成作品</button><button class="b ghost" onclick="go('create')">换一个主题</button></div></div><div class="card"><h4>创作边界</h4><p>AI 生成稿是建议，不代表真实身份、真实历史图像或专业鉴定；用户可以拒绝与删除。</p></div></div>`}
function artResult(){return `<h1 class="h1">我的作品 · ${state.art}</h1><div class="split"><div class="card"><div class="light">${state.art==='民国风写真'?'👒':state.art==='人生故事'?'📖':'🖌️'}</div><h3>这是一张概念预览</h3><p>没有调用真实生成模型，也没有生成真实人像。真正 AI PoC 将在后续单独验证。</p><div class="footbuttons"><button class="b" onclick="state.artSaved=true;render()">${state.artSaved?'✓ 已模拟私密保存':'私密保存'}</button><button class="b secondary" onclick="go('share')">选择分享对象</button><button class="b ghost" onclick="go('artSetup')">重新开始</button></div></div><div class="card"><h4>作品归谁？</h4><p>默认私密，子女即使为会员付费，也不能查看未经本人分享的内容。</p><span class="tag">默认不公开</span></div></div>`}
function share(){return `<h1 class="h1">选择分享范围</h1><div class="card" style="max-width:720px"><div class="status">仅自己可见（默认）</div><div class="status">☐ 分享给指定老友（需本人确认）</div><div class="status">☐ 分享给指定家人（需本人确认）</div><div class="warn">本稿不连接真实账号、联系人或消息。未勾选任何人时不可自动发布。</div><div class="footbuttons"><button class="b" onclick="state.artSaved=true;go('artResult')">保持私密</button><button class="b secondary" onclick="go('artResult')">返回作品</button></div></div>`}
function course(){return `<h1 class="h1">数字人课程</h1><p class="sub">内容由课程提供方负责；你可以选择更喜欢的讲师与声线。</p><div class="split"><div class="card"><div class="light">📚</div><h3>《苏东坡与赤壁》</h3><p>示例历史课程 · 讲解资料需供应商审核。此处为静态课程交互草图。</p><div class="formline"><label>讲师形象</label><div class="tabs">${['温婉老师','风趣老先生','年轻说书人'].map(x=>`<button class="${state.speaker===x?'active':''}" onclick="state.speaker='${x}';render()">${x}</button>`).join('')}</div></div><div class="formline"><label>声线</label><div class="tabs">${['温和女声','醇厚男声','轻快声音'].map(x=>`<button class="${state.voice===x?'active':''}" onclick="state.voice='${x}';render()">${x}</button>`).join('')}</div></div><div class="footbuttons"><button class="b" onclick="state.courseRunning=!state.courseRunning;render()">${state.courseRunning?'暂停讲课':'开始课程演示'}</button><button class="b secondary" onclick="openAI('赤壁之战')">向讲师提问</button></div></div><div class="card"><div class="person">${state.speaker==='温婉老师'?'👩‍🏫':state.speaker==='风趣老先生'?'👨‍🏫':'🧑‍🎤'}</div><h3>${state.speaker}</h3><p>声线：${state.voice}</p><span class="tag">${state.courseRunning?'正在模拟讲课':'等待开始'}</span><p>真正数字人音画同步、实时问答和授权声线尚待 PoC；本页面不输出实际声音。</p></div></div>`}
function me(){if(state.mode==='public')return `<h1 class="h1">公共服务模式</h1><p class="sub">这里不展示任何个人作品、记忆、订单或家庭关系。</p><div class="card"><h3>结束体验并清除数据</h3><p>公共访客身份、临时作品与会话随本次演示结束清空。</p><button class="b" onclick="clearPublic()">结束并清除</button></div>`;return `<h1 class="h1">我的生活</h1><p class="sub">作品、记忆和权益属于用户本人。</p><div class="grid">${tile('📺','追剧与收藏','随时续播上次看的节目。',"go('video')")}${tile('🖼️','我的作品','作品默认私密，由本人决定分享。',"go('artResult')")}${tile('🛒','购物与订单','统一商城交易记录、权益和售后。',"go('cart')")}${tile('👫','老友与亲情','查看分享给我的作品，不读取私人聊天。',"go('share')")}${tile('👩','人格与记忆','数字人形象、声线、记忆与隐私控制。',"go('persona')")}${tile('🎟️','报名和会员','查看活动记录、会员权益。',"go('life')")}</div>`}
function persona(){return `<h1 class="h1">我的数字闺蜜</h1><p class="sub">有稳定的人格，也能进入不同 RP 角色世界。只有你能管理自己的记忆。</p><div class="split"><div class="card"><div class="person">👩</div><h3>当前私人闺蜜</h3><p>形象、声线和有限讲述风格可设置。点击或自主启用语音唤醒。</p><div class="formline"><label>语音唤醒</label><label style="display:flex;align-items:center;gap:10px;font-size:16px"><input type="checkbox" ${state.voiceWake?'checked':''} onchange="state.voiceWake=this.checked;render()"/> ${state.voiceWake?'已启用（仅交互演示）':'关闭'}</label></div><div class="formline"><label>兴趣与长期记忆</label>经同意逐步积累，可查看、更正、删除、导出。敏感信息另行授权；RP 独立保存。</div><button class="b secondary" onclick="go('course')">看看 RP / 数字人课程</button></div><div class="card"><h4>我与家人的隐私边界</h4><p>子女购买会员，并不意味着获得我的私人对话或记忆访问权。</p><div class="warn">功能规则与界面正在设计；本稿不保存任何真实个人信息。</div></div></div>`}
function clearPublic(){state.mode='public';state.screen='home';state.cart=[];state.item=null;state.publicIdentified=false;state.submitted=false;state.artSaved=false;state.aiResult=null;state.episode=1;state.progress=0;state.saved=false;closeAI();render()}
function openAI(q=''){state.ai=true;state.aiText=q;state.aiResult=q?(q.includes('课')||q.includes('赤壁')?'course':'products'):null;renderAI()}
function closeAI(){state.ai=false;document.getElementById('modal').innerHTML=''}
function chooseAI(q){state.aiText=q;state.aiResult=q.includes('课')||q.includes('赤壁')?'course':q.includes('活动')?'events':'products';renderAI()}
function inputAI(){const val=document.getElementById('aiInput')?.value.trim();if(val)chooseAI(val)}
function renderAI(){if(!state.ai){document.getElementById('modal').innerHTML='';return}const pub=state.mode==='public';let result='';if(state.aiResult==='products')result=`<div class="airesult"><strong>商品检索演示</strong><p>在平台商城找到了这些样本商品。实际 AI 工具检索和价格校验尚未接入。</p>${cards.slice(0,2).map((x,i)=>`<div class="formline"><strong>${x.name}</strong><br/>${x.detail} · ¥${x.price.toFixed(2)} · ${x.merchant}<div style="margin-top:6px"><button class="b secondary" onclick="state.item=cards[${i}];closeAI();go('product')">看商品详情</button></div></div>`).join('')}</div>`;else if(state.aiResult==='events')result=`<div class="airesult"><strong>活动检索演示</strong><p>本网格找到示例书法课，是否查看报名条件？</p><button class="b" onclick="closeAI();eventDetail(1)">去看看书法课</button></div>`;else if(state.aiResult==='course')result=`<div class="airesult"><strong>有限答疑模拟</strong><p>赤壁一词涉及历史背景和文学作品。真实答疑需使用审核课程资料并给出来源。</p><button class="b secondary" onclick="closeAI();go('course')">打开数字人课程</button></div>`;document.getElementById('modal').innerHTML=`<div class="shade" onclick="closeAI()"></div><aside class="drawer"><header><div><span class="tag">${pub?'公共服务 AI':'私人闺蜜 · 轻任务'}</span><h2>${pub?'有什么需要帮忙？':'想让我帮你做什么？'}</h2></div><button class="pill" onclick="closeAI()">✕ 关闭</button></header><p class="muted">${pub?'公共模式不调用私人记忆。':'只在你主动唤起时回应。办事操作须经你确认。'}</p><div class="inputrow"><input id="aiInput" placeholder="比如：帮我找便宜的洗衣液" value="${e(state.aiText)}" onkeydown="if(event.key==='Enter')inputAI()"/><button class="b" onclick="inputAI()">发送</button></div><div class="choices"><button onclick="chooseAI('帮我找便宜的洗衣液')">🧴 帮我比较洗衣液</button><button onclick="chooseAI('附近有什么书法活动')">📅 找附近的书法课</button><button onclick="chooseAI('赤壁之战为什么重要')">📚 问问数字人讲师</button></div>${result}<div class="warn">本面板只是交互流程模拟，未实际请求模型、商城商品服务或活动接口。${pub?'公共模式使用后请结束并清除。':''}</div>${!pub?`<button class="b ghost" onclick="closeAI();go('persona')">切换私人角色 / 记忆设置</button>`:''}</aside>`}
function render(){const pub=state.mode==='public';document.getElementById('switch').textContent=pub?'切到个人专用机':'切到公共服务机';document.getElementById('modeSide').textContent=pub?'当前：公共服务 / 演示':'当前：个人专用终端';document.getElementById('aiLabel').textContent=pub?'叫公共服务 AI':'叫我的闺蜜';document.getElementById('profile').textContent=pub?'结束体验':'我的';const active=(state.screen==='player'?'video':['event','signup','scan','applied','course'].includes(state.screen)?'life':['product','cart','checkout','orderDone'].includes(state.screen)?'shop':['artSetup','artResult','share'].includes(state.screen)?'create':state.screen);document.getElementById('side').innerHTML=nav.map(([k,i,t])=>`<button class="${active===k?'active':''}" onclick="go('${k}')"><span class="ico">${i}</span>${t}</button>`).join('')+`<button onclick="go('me')"><span class="ico">☻</span>${pub?'结束体验':'我的'}</button>`;document.getElementById('mobilebar').innerHTML=nav.map(([k,i,t])=>`<button class="${active===k?'active':''}" onclick="go('${k}')"><b>${i}</b>${t}</button>`).join('');const routes={home,video,player,life,event,signup,applied,scan,shop,product:productPage,cart,checkout,orderDone,create,artSetup,artResult,share,course,me,persona};document.getElementById('view').innerHTML=(routes[state.screen]||home)();document.getElementById('crumb').textContent='AI MIRROR / '+(pub?'公共服务机':'个人模式')+' / '+(nav.find(x=>x[0]===active)?.[2]||'我的');if(state.ai)renderAI()}
render();
</script>
</body>
</html>
