name: Publish Jianqu visual review to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jianqu-gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved design prototype branch
        uses: actions/checkout@v4
        with:
          ref: feat/jianqu-opendesign-v02
          persist-credentials: false

      - name: Stage only public static demo resources
        shell: bash
        run: |
          set -euo pipefail
          source="design/prototypes/jianqu-v02"
          test -s "$source/index.html"
          test -s "$source/mobile.html"
          test -s "$source/CREDITS.md"
          test -s "$source/assets/app.js"
          test -s "$source/assets/jianqu-v02.js"

          mkdir -p _site/assets
          cp "$source/index.html" "$source/mobile.html" "$source/CREDITS.md" _site/
          cp -R "$source/assets/." _site/assets/
          touch _site/.nojekyll

          node --check _site/assets/app.js
          node --check _site/assets/jianqu-v02.js
          grep -q 'jianqu-v02.js' _site/index.html
          grep -q '见趣' _site/mobile.html
          test -s _site/assets/img/art-reading.jpg

          echo 'Demo source revision:'
          git rev-parse HEAD
          echo 'Published files:'
          find _site -type f | sort
          test ! -e _site/docs
          test ! -e _site/AGENTS.md

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload public Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check public routes and assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://sanchuang-dev.github.io/ai-mirror"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch() {
            local path="$1" output="$2"
            curl --fail --silent --show-error --location --retry 12 --retry-delay 5 \
              --retry-all-errors --max-time 20 "$base/$path" -o "$tmp/$output"
            test -s "$tmp/$output"
            echo "HTTP OK: $base/$path"
          }

          fetch "" index.html
          fetch "mobile.html" mobile.html
          fetch "assets/app.css" app.css
          fetch "assets/app.js" app.js
          fetch "assets/jianqu-v02.css" jianqu.css
          fetch "assets/jianqu-v02.js" jianqu.js
          fetch "assets/img/art-reading.jpg" reading.jpg
          fetch "CREDITS.md" credits.md

          grep -q 'jianqu-v02.js' "$tmp/index.html"
          grep -q '见趣' "$tmp/mobile.html"
          grep -q '报名流程演示完成' "$tmp/jianqu.js"
          test "$(wc -c < "$tmp/reading.jpg")" -gt 5000
          echo "Published Jianqu review prototype verified"
