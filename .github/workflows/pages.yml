name: Publish Jianqu visual review to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
  workflow_dispatch:
  # Default-branch workflow publishes dev only after dev's own quality gate passes.
  # PR checks of the same workflow are intentionally ineligible for deployment.
  workflow_run:
    workflows:
      - Jianqu Web baseline checks
    branches:
      - dev
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jianqu-gh-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'dev' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved design prototype branch
        uses: actions/checkout@v4
        with:
          ref: feat/jianqu-opendesign-v02
          persist-credentials: false

      - name: Stage only public static demo resources
        shell: bash
        run: |
          set -euo pipefail
          source="design/prototypes/jianqu-v02"
          test -s "$source/index.html"
          test -s "$source/mobile.html"
          test -s "$source/CREDITS.md"
          test -s "$source/assets/app.js"
          test -s "$source/assets/jianqu-v02.js"

          mkdir -p _site/assets
          cp "$source/index.html" "$source/mobile.html" "$source/CREDITS.md" _site/
          cp -R "$source/assets/." _site/assets/
          touch _site/.nojekyll

          node --check _site/assets/app.js
          node --check _site/assets/jianqu-v02.js
          grep -q 'jianqu-v02.js' _site/index.html
          grep -q '见趣' _site/mobile.html
          test -s _site/assets/img/art-reading.jpg

          echo 'Demo source revision:'
          git rev-parse HEAD
          echo 'Published files:'
          find _site -type f | sort
          test ! -e _site/docs
          test ! -e _site/AGENTS.md


      - name: Checkout reviewed dev engineering sources (read-only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'dev' }}
          path: dev-source
          persist-credentials: false

      - name: Reject stale dev workflow_run before publication
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          VERIFIED_DEV_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(git -C dev-source rev-parse HEAD)"
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/branches/dev" --jq '.commit.sha')"
          test "$actual" = "$VERIFIED_DEV_SHA"
          if test "$latest" != "$VERIFIED_DEV_SHA"; then
            echo "::error::Skipping stale dev check; dev has advanced. Newer CI will deploy."
            exit 1
          fi

      - name: Stage isolated dev H01 preview (static web only)
        shell: bash
        run: |
          set -euo pipefail
          source="dev-source/web"
          test -s "$source/index.html"
          test -s "$source/assets/app.js"
          test -s "$source/assets/components.css"
          test -s "$source/assets/tokens.css"
          test -s "$source/data/api.js"
          test -s "$source/pages/home.js"
          test -s "$source/components/app-shell.js"
          test -s "$source/components/kit.js"
          test -s "$source/assets/img/art-reading.jpg"

          mkdir -p _site/dev/{assets,components,data,pages}
          cp "$source/index.html" _site/dev/index.html
          cp -R "$source/assets/." _site/dev/assets/
          cp -R "$source/components/." _site/dev/components/
          cp -R "$source/data/." _site/dev/data/
          cp -R "$source/pages/." _site/dev/pages/

          # Never serve unexpected files or symlink targets from the engineering branch.
          if find _site/dev -type l -print -quit | grep -q .; then
            echo "::error::dev preview must not contain symlinks."
            exit 1
          fi
          if find _site/dev -type f ! \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.svg' -o -name '*.webp' -o -name '*.md' \) -print -quit | grep -q .; then
            echo "::error::Unexpected dev preview file extension."
            exit 1
          fi

          node --check _site/dev/assets/app.js
          node --check _site/dev/components/app-shell.js
          node --check _site/dev/components/kit.js
          node --check _site/dev/pages/home.js
          node --check _site/dev/data/api.js
          grep -q 'H01' _site/dev/index.html
          grep -q './assets/app.js' _site/dev/index.html
          test ! -e _site/dev/tests
          test ! -e _site/dev/.github
          test ! -e _site/dev/AGENTS.md
          test ! -e _site/dev/package.json
          echo "Dev preview source revision:"
          git -C dev-source rev-parse HEAD
          echo "Isolated site routes: / (OpenDesign) and /dev/ (dev H01)."

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload public Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request' && needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    if: github.event_name != 'pull_request' && needs.deploy.result == 'success'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check public routes and assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://sanchuang-dev.github.io/ai-mirror"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch() {
            local path="$1" output="$2"
            curl --fail --silent --show-error --location --retry 12 --retry-delay 5 \
              --retry-all-errors --max-time 20 "$base/$path" -o "$tmp/$output"
            test -s "$tmp/$output"
            echo "HTTP OK: $base/$path"
          }

          fetch "" index.html
          fetch "mobile.html" mobile.html
          fetch "assets/app.css" app.css
          fetch "assets/app.js" app.js
          fetch "assets/jianqu-v02.css" jianqu.css
          fetch "assets/jianqu-v02.js" jianqu.js
          fetch "assets/img/art-reading.jpg" reading.jpg
          fetch "CREDITS.md" credits.md
          fetch "dev/" dev-index.html
          fetch "dev/assets/app.js" dev-app.js
          fetch "dev/assets/tokens.css" dev-tokens.css
          fetch "dev/assets/components.css" dev-components.css
          fetch "dev/components/app-shell.js" dev-app-shell.js
          fetch "dev/components/kit.js" dev-kit.js
          fetch "dev/pages/home.js" dev-home.js
          fetch "dev/data/api.js" dev-api.js
          fetch "dev/assets/img/art-reading.jpg" dev-reading.jpg

          grep -q 'jianqu-v02.js' "$tmp/index.html"
          grep -q '见趣' "$tmp/mobile.html"
          grep -q '报名流程演示完成' "$tmp/jianqu.js"
          test "$(wc -c < "$tmp/reading.jpg")" -gt 5000
          grep -q 'H01' "$tmp/dev-index.html"
          grep -q 'mountHome' "$tmp/dev-app.js"
          grep -q 'createSceneShell' "$tmp/dev-app-shell.js"
          grep -q 'createNode' "$tmp/dev-kit.js"
          grep -q 'createHomeController' "$tmp/dev-home.js"
          test "$(wc -c < "$tmp/dev-reading.jpg")" -gt 5000
          echo "Published unchanged OpenDesign / and isolated dev H01 /dev/ verified"
